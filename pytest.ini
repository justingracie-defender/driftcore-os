[pytest]
# DriftCore's test files are standalone scripts: each runs its checks at
# import and is meant to be executed in its own process
#     python test_memory_core.py
# Several of them deliberately trip the global enforcement shutdown
# (_SHUTDOWN_TRIGGERED). That flag is process-wide and sticky BY DESIGN —
# a real tamper shutdown must not silently reset. The only place this bites
# is pytest, which imports every test_*.py into ONE process during
# collection, so the shutdown state from one file leaks into the next.
#
# Fix: we do NOT let pytest collect the script files directly. pytest is
# pointed at check_*.py only. The single check_driftcore_suite.py runner
# executes each test_*.py in its own subprocess — i.e. the exact per-file
# isolation the suite was built for — so `pytest` and `python test_x.py`
# both work, and neither changes the test files themselves.
python_files = check_*.py
python_functions = test_*
addopts = -v
